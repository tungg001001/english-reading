    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->

    <!-- React 18 & ReactDOM UMD -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

    <style>

        height: 6px;

  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-teal-100 selection:text-teal-900 min-h-screen flex flex-col">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // React-safe SVG Icon component
      const Icon = ({ name, className = "w-4 h-4" }) => {
        const svgMap = {
          'book-open': <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zm22 0h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>,
          'target': <><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>,
          'check-square': <><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></>,
          'clock': <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
          'zap': <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
          'lightbulb': <><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/></>,
          'volume-2': <><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></>,
          'check-circle': <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
          'x-circle': <><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></>,
          'bookmark': <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>,
          'file-text': <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></>,
          'sparkles': <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/>
        };

        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
            className={className}
          >
            {svgMap[name] || null}
          </svg>
        );
      };

      // Voice TTS Utility
      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.9;
          window.speechSynthesis.speak(utterance);
        }
      };

      // EXPANDED 6 ARTICLES DATABASE
      const ARTICLES_DATA = [
        {
          id: 1,
          title: 'The Rise of Artificial Intelligence in Everyday Life',
          category: '科技趨勢',
          level: '中級 (Intermediate)',
          wordCount: 220,
          summary: '探討人工智慧如何從實驗室走入大眾日常生活，並重塑智慧型手機、個人化推薦與醫療診斷。',
          paragraphs: [
            'Artificial Intelligence (AI) is no longer just a subject of science fiction. Over the past decade, rapid advancements in machine learning algorithms have integrated AI directly into our daily routines.',
            'When you unlock your smartphone with facial recognition, receive song recommendations, or use voice assistants, you are relying on AI technology. Furthermore, healthcare industries use AI to analyze medical images, helping doctors detect diseases faster.',
            'While these technological breakthroughs offer unmatched convenience, they also raise ethical concerns regarding privacy and job displacement. Balancing technological innovation with responsible governance remains one of society\'s most critical challenges.'
          ],
          keywords: [
            { word: 'advancements', pos: 'n.', mean: '進步、進展', phonetic: '/ədˈvæns.mənts/' },
            { word: 'integrated', pos: 'v.', mean: '融合、整合', phonetic: '/ˈɪn.t̬ə.ɡreɪ.t̬ɪd/' },
            { word: 'breakthroughs', pos: 'n.', mean: '突破、重大進展', phonetic: '/ˈbreɪk.θruːz/' },
            { word: 'displacement', pos: 'n.', mean: '取代、移位', phonetic: '/dɪsˈpleɪs.mənt/' }
          ],
          questions: [
            {
              question: 'What is the main topic of the passage?',
              options: ['The history of science fiction movies', 'How AI influences our daily life and its challenges', 'Methods to unlock smartphones securely', 'Why voice assistants replace healthcare workers'],
              answer: 1,
              explanation: '文章主要描述 AI 如何融入日常生活（手機、醫療）以及隨之而來的道德與隱私挑戰。'
            },
            {
              question: 'According to the second paragraph, how is AI applied in healthcare?',
              options: ['By manufacturing medicines', 'By assisting doctors in analyzing medical images', 'By replacing human surgeons entirely', 'By scheduling hospital appointments'],
              answer: 1,
              explanation: '第二段指出："healthcare industries use AI to analyze medical images, helping doctors detect diseases faster."'
            }
          ]
        },
        {
          id: 2,
          title: 'Sustainable Tourism: Protecting Our Planet While Exploring',
          category: '環境與永續',
          level: '中高級 (Upper-Intermediate)',
          wordCount: 250,
          summary: '介紹永續旅遊的核心概念，強調如何在體驗異國文化的同時減少對在地環境與生態的負面影響。',
          paragraphs: [
            'Tourism brings significant economic benefits to communities worldwide. However, rapid increases in visitor numbers can strain local infrastructure and damage fragile ecosystems.',
            'Sustainable tourism seeks to minimize negative environmental impacts while preserving cultural heritage. Travelers are encouraged to support local businesses, reduce single-use plastic waste, and respect wildlife habitats during their journeys.',
            'By making conscious choices, eco-friendly tourists ensure that famous historical sites and natural wonders remain vibrant for future generations to admire.'
          ],
          keywords: [
            { word: 'sustainable', pos: 'adj.', mean: '永續的、可持續的', phonetic: '/səˈsteɪ.nə.bəl/' },
            { word: 'infrastructure', pos: 'n.', mean: '基礎建設', phonetic: '/ˈɪn.frəˌstrʌk.tʃɚ/' },
            { word: 'preserving', pos: 'v.', mean: '保護、保存', phonetic: '/prɪˈzɝː.vɪŋ/' },
            { word: 'vibrant', pos: 'adj.', mean: '充滿生機的、鮮豔的', phonetic: '/ˈvaɪ.brənt/' }
          ],
          questions: [
            {
              question: 'What is the primary goal of sustainable tourism?',
              options: ['To lower travel ticket prices', 'To minimize environmental damage while preserving culture', 'To restrict foreigners from visiting natural parks', 'To build more hotels in rural areas'],
              answer: 1,
              explanation: '第二段提及：Sustainable tourism seeks to minimize negative environmental impacts while preserving cultural heritage.'
            }
          ]
        },
        {
          id: 3,
          title: 'The Science of Sleep and Brain Plasticity',
          category: '健康與醫學',
          level: '中級 (Intermediate)',
          wordCount: 215,
          summary: '剖析充足睡眠對於大腦記憶重組、神經修復以及清空有害代謝廢物的關鍵生理作用。',
          paragraphs: [
            'Sleep is essential for physical recovery and cognitive performance. During deep sleep stages, the brain reorganizes memories, transferring short-term information into long-term storage.',
            'Neuroscientists have discovered that sleep cleanses the brain by flushing out toxic waste products built up throughout waking hours. Depriving oneself of restful sleep impairs focus, mood regulation, and decision-making abilities.',
            'Establishing a consistent nighttime routine and limiting screen exposure before bed significantly improves sleep quality and long-term brain health.'
          ],
          keywords: [
            { word: 'cognitive', pos: 'adj.', mean: '認知的、感知的', phonetic: '/ˈkɑːɡ.nə.t̬ɪv/' },
            { word: 'cleanses', pos: 'v.', mean: '清潔、淨化', phonetic: '/klenzɪz/' },
            { word: 'depriving', pos: 'v.', mean: '剝奪、使喪失', phonetic: '/dɪˈpraɪv.ɪŋ/' },
            { word: 'consistent', pos: 'adj.', mean: '持續的、一致的', phonetic: '/kənˈsɪs.tənt/' }
          ],
          questions: [
            {
              question: 'What happens to short-term memory during deep sleep?',
              options: ['It is completely erased', 'It is transferred into long-term storage', 'It prevents physical recovery', 'It converts into metabolic waste'],
              answer: 1,
              explanation: '第一段明確指出：the brain reorganizes memories, transferring short-term information into long-term storage.'
            }
          ]
        },
        {
          id: 4,
          title: 'Social Media Dynamics and Digital Well-being',
          category: '心理與社會',
          level: '中高級 (Upper-Intermediate)',
          wordCount: 240,
          summary: '探討社群媒體對當代年輕人心理健康的影響，分析從眾心理與數位焦慮的形成。',
          paragraphs: [
            'Social media platforms have transformed how human beings communicate and build relationships. However, continuous exposure to curated lifestyles often triggers envy and anxiety.',
            'Psychologists point out that "Fear of Missing Out" (FOMO) compels users to check notification feeds constantly. This behavior disrupts daily productivity and weakens real-world interpersonal interactions.',
            'To cultivate digital well-being, individuals must practice mindfulness, set strict screen-time boundaries, and prioritize meaningful face-to-face connections.'
          ],
          keywords: [
            { word: 'curated', pos: 'adj.', mean: '精心企劃/呈現的', phonetic: '/ˈkjʊr.eɪ.t̬ɪd/' },
            { word: 'compels', pos: 'v.', mean: '強迫、迫使', phonetic: '/kəmˈpelz/' },
            { word: 'disrupts', pos: 'v.', mean: '干擾、打亂', phonetic: '/dɪsˈrʌpts/' },
            { word: 'mindfulness', pos: 'n.', mean: '正念、專注覺察', phonetic: '/ˈmaɪnd.fəl.nəs/' }
          ],
          questions: [
            {
              question: 'According to the article, what is a consequence of "FOMO"?',
              options: ['Increased sleep quality', 'Checking feeds constantly and disrupted productivity', 'Better face-to-face relationships', 'Higher physical fitness'],
              answer: 1,
              explanation: '第二段說明 FOMO 會迫使使用者頻繁查看通知，干擾日常生產力。'
            }
          ]
        },
        {
          id: 5,
          title: 'The Architectural Marvels of Ancient Egypt',
          category: '歷史與文化',
          level: '中級 (Intermediate)',
          wordCount: 210,
          summary: '回顧古埃及金字塔與神殿建築，探索古文明精湛工程技術與宗教信念的完美結合。',
          paragraphs: [
            'The pyramids of Giza remain among the most extraordinary engineering feats in human history. Built thousands of years ago, these stone monuments reflect ancient Egypt\'s sophisticated mathematical precision.',
            'Scholars believe workers used intricate ramp systems and heavy levers to transport colossal limestone blocks across vast desert sands. These tombs were constructed to preserve pharaohs for the afterlife.',
            'Studying ancient architecture provides invaluable insights into early labor organization, religious devotion, and technological ingenuity.'
          ],
          keywords: [
            { word: 'extraordinary', pos: 'adj.', mean: '非凡的、驚人的', phonetic: '/ɪkˈstrɔːr.də.ner.i/' },
            { word: 'sophisticated', pos: 'adj.', mean: '精密的、複雜的', phonetic: '/səˈfɪs.tə.keɪ.t̬ɪd/' },
            { word: 'colossal', pos: 'adj.', mean: '巨大的、龐大的', phonetic: '/kəˈlɑː.səl/' },
            { word: 'ingenuity', pos: 'n.', mean: '獨創力、聰明才智', phonetic: '/ˌɪn.dʒəˈnuː.ə.t̬i/' }
          ],
          questions: [
            {
              question: 'Why were the Egyptian pyramids constructed?',
              options: ['To store harvested crops', 'To serve as royal tombs for the afterlife', 'To measure seasonal desert rainfall', 'To host sports tournaments'],
              answer: 1,
              explanation: '第二段末句：These tombs were constructed to preserve pharaohs for the afterlife.'
            }
          ]
        },
        {
          id: 6,
          title: 'Understanding Global Inflation and Economic Forces',
          category: '商業經濟',
          level: '高級 (Advanced)',
          wordCount: 235,
          summary: '解析全球通貨膨脹的成因，包含供應鏈瓶頸、貨幣政策與消費者需求的連動關係。',
          paragraphs: [
            'Inflation represents the rate at which the general level of prices for goods and services rises, eroding purchasing power. Central banks around the world closely monitor inflation indices to stabilize economies.',
            'Cost-push inflation occurs when production expenses, such as raw materials and labor wages, increase significantly. Conversely, demand-pull inflation is driven by strong consumer demand outstripping limited supply.',
            'Policymakers often adjust interest rates to curb high inflation, aiming to restore market balance without causing economic recession.'
          ],
          keywords: [
            { word: 'eroding', pos: 'v.', mean: '侵蝕、削弱', phonetic: '/ɪˈroʊd.ɪŋ/' },
            { word: 'indices', pos: 'n.', mean: '指數、指標', phonetic: '/ˈɪn.də.siːz/' },
            { word: 'outstripping', pos: 'v.', mean: '超過、勝過', phonetic: '/ˌaʊtˈstrɪp.ɪŋ/' },
            { word: 'recession', pos: 'n.', mean: '經濟衰退', phonetic: '/rɪˈseʃ.ən/' }
          ],
          questions: [
            {
              question: 'What causes cost-push inflation?',
              options: ['Decrease in labor wages', 'Increase in production expenses like raw materials', 'Reduction in interest rates', 'Extreme consumer savings'],
              answer: 1,
              explanation: '第二段提及：Cost-push inflation occurs when production expenses, such as raw materials and labor wages, increase significantly.'
            }
          ]
        }
      ];

      // READING STRATEGIES DATA
      const READING_STRATEGIES = [
        {
          title: '1. 略讀 (Skimming)',
          purpose: '快速抓取文章主旨與整體結構',
          description: '不要逐字閱讀！重點看標題、第一段、每段首句與末段，迅速了解文章講什麼。',
          steps: ['閱讀文章標題與副標題', '細讀第一段掌握主題', '快速瀏覽各段的第一句 (Topic Sentence)', '讀最後一段確認結論']
        },
        {
          title: '2. 掃讀 (Scanning)',
          purpose: '迅速搜尋特定資訊（如數字、年代、人名）',
          description: '心中帶著問題，眼睛像雷達一樣快速掃過文字，尋找特定關鍵字或符號。',
          steps: ['明確你要找的目標（例如年份 2024、百分比 %）', '放鬆視覺焦點，跳過非相關內容', '發現關鍵字時停下閱讀前後文']
        },
        {
          title: '3. 語境猜字 (Context Clues)',
          purpose: '遇到生字時不依賴字典，利用前後文推測字義',
          description: '觀察生字前後的同義詞、反義詞、舉例（such as）或標點符號（逗號/破折號）的補充說明。',
          steps: ['標記不懂的目標單字', '尋找 signal words（如 or, meaning, unlike, for example）', '判斷該字的詞性與正負褒貶色彩']
        }
      ];

      function App() {
        const [activeTab, setActiveTab] = useState('reader'); // 'reader' | 'strategies' | 'quiz'
        const [selectedArticleIndex, setSelectedArticleIndex] = useState(0);
        const [categoryFilter, setCategoryFilter] = useState('全選');
        const [readingTimer, setReadingTimer] = useState(0);
        const [isTimerRunning, setIsTimerRunning] = useState(false);
        const [activeKeyword, setActiveKeyword] = useState(null);
        const [userQuizAnswers, setUserQuizAnswers] = useState({});

        const currentArticle = ARTICLES_DATA[selectedArticleIndex];

        // Filter categories
        const categories = useMemo(() => {
          return ['全選', ...new Set(ARTICLES_DATA.map(a => a.category))];
        }, []);

        const filteredArticles = useMemo(() => {
          if (categoryFilter === '全選') return ARTICLES_DATA;
          return ARTICLES_DATA.filter(a => a.category === categoryFilter);
        }, [categoryFilter]);

        useEffect(() => {
          let interval = null;
          if (isTimerRunning) {
            interval = setInterval(() => {
              setReadingTimer((prev) => prev + 1);
            }, 1000);
          } else {
            clearInterval(interval);
          }
          return () => clearInterval(interval);
        }, [isTimerRunning]);

        const formatTime = (seconds) => {
          const mins = Math.floor(seconds / 60);
          const secs = seconds % 60;
          return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        };

        const calculateWPM = () => {
          if (readingTimer === 0) return 0;
          return Math.round((currentArticle.wordCount / readingTimer) * 60);
        };

        // Render paragraph with clickable vocabulary highlight
        const renderInteractiveParagraph = (paragraph) => {
          let words = paragraph.split(' ');
          return words.map((wordStr, index) => {
            const cleanWord = wordStr.replace(/[^a-zA-Z]/g, '').toLowerCase();
            const foundKeyword = currentArticle.keywords.find(
              k => k.word.toLowerCase() === cleanWord
            );

            if (foundKeyword) {
              return (
                <span key={index} className="inline-block mx-0.5">
                  <button
                    onClick={() => {
                      setActiveKeyword(foundKeyword);
                      speakText(foundKeyword.word);
                    }}
                    className="px-1.5 py-0.5 bg-teal-100 hover:bg-teal-200 text-teal-900 rounded font-bold transition-all underline decoration-teal-500 decoration-2 underline-offset-2 cursor-pointer"
                  >
                    {wordStr}
                  </button>
                </span>
              );
            }
            return wordStr + ' ';
          });
        };

        const handleOptionSelect = (qIdx, oIdx) => {
          setUserQuizAnswers({
            ...userQuizAnswers,
            [qIdx]: oIdx
          });
        };

        return (
          <div className="flex-1 flex flex-col min-h-screen">
            {/* Header */}
            <header className="bg-white border-b border-slate-200 sticky top-0 z-50">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('reader')}>
                  <div className="w-10 h-10 bg-teal-600 rounded-2xl flex items-center justify-center text-white font-extrabold text-xl shadow-md shadow-teal-200">
                    R
                  </div>
                  <div>
                    <h1 className="font-extrabold text-slate-900 text-lg sm:text-xl leading-none">ReadingMaster</h1>
                    <span className="text-[10px] font-extrabold text-teal-600 tracking-wider uppercase mt-1 block">英文閱讀理解大師</span>
                  </div>
                </div>

                <nav className="flex items-center space-x-1 sm:space-x-2 bg-slate-100 p-1.5 rounded-2xl text-xs sm:text-sm font-bold">
                  <button
                    onClick={() => setActiveTab('reader')}
                    className={`px-3.5 py-2 rounded-xl transition-all flex items-center space-x-1.5 ${
                      activeTab === 'reader' ? 'bg-white text-teal-700 shadow-2xs' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Icon name="book-open" className="w-4 h-4" />
                    <span>文章閱讀訓練</span>
                  </button>
                  <button
                    onClick={() => setActiveTab('strategies')}
                    className={`px-3.5 py-2 rounded-xl transition-all flex items-center space-x-1.5 ${
                      activeTab === 'strategies' ? 'bg-white text-teal-700 shadow-2xs' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Icon name="target" className="w-4 h-4" />
                    <span>三大閱讀技巧</span>
                  </button>
                  <button
                    onClick={() => setActiveTab('quiz')}
                    className={`px-3.5 py-2 rounded-xl transition-all flex items-center space-x-1.5 ${
                      activeTab === 'quiz' ? 'bg-white text-teal-700 shadow-2xs' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Icon name="check-square" className="w-4 h-4" />
                    <span>閱讀理解測驗</span>
                  </button>
                </nav>
              </div>
            </header>

            {/* Main Content */}
            <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-10">
              {activeTab === 'reader' && (
                <div className="space-y-8 animate-fade-in">
                  {/* Category Filter & Article Selector */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-2xs space-y-4">
                    {/* Category Tabs */}
                    <div className="flex items-center space-x-2 overflow-x-auto pb-1">
                      <span className="text-xs font-extrabold text-slate-400 uppercase tracking-wider shrink-0 mr-1">主題領域:</span>
                      {categories.map((cat, idx) => (
                        <button
                          key={idx}
                          onClick={() => setCategoryFilter(cat)}
                          className={`px-3 py-1 rounded-xl text-xs font-bold transition-all shrink-0 ${
                            categoryFilter === cat
                              ? 'bg-teal-700 text-white'
                              : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>

                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pt-2 border-t border-slate-100">
                      <div className="space-y-1 w-full md:w-auto">
                        <span className="text-[11px] font-extrabold text-teal-600 uppercase tracking-wider">點選文章進行互動閱讀 (共 {ARTICLES_DATA.length} 篇)</span>
                        <div className="flex flex-wrap gap-2 pt-1">
                          {filteredArticles.map((art) => {
                            const originalIdx = ARTICLES_DATA.findIndex(a => a.id === art.id);
                            return (
                              <button
                                key={art.id}
                                onClick={() => {
                                  setSelectedArticleIndex(originalIdx);
                                  setReadingTimer(0);
                                  setIsTimerRunning(false);
                                  setActiveKeyword(null);
                                  setUserQuizAnswers({});
                                }}
                                className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all border ${
                                  selectedArticleIndex === originalIdx
                                    ? 'bg-teal-600 text-white border-teal-600 shadow-xs'
                                    : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                                }`}
                              >
                                {art.title}
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      {/* Speed Meter */}
                      <div className="flex items-center space-x-4 bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-200 shrink-0 w-full md:w-auto justify-between">
                        <div className="flex items-center space-x-2">
                          <Icon name="clock" className="w-4 h-4 text-teal-600" />
                          <span className="font-mono text-sm font-bold text-slate-800">{formatTime(readingTimer)}</span>
                        </div>
                        <button
                          onClick={() => setIsTimerRunning(!isTimerRunning)}
                          className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${
                            isTimerRunning ? 'bg-rose-500 text-white' : 'bg-teal-600 text-white'
                          }`}
                        >
                          {isTimerRunning ? '暫停計時' : '開始閱讀計時'}
                        </button>
                        <div className="text-xs font-bold text-slate-500">
                          速度：<span className="text-teal-700">{calculateWPM()} WPM</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Main Article Display */}
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* Reading Text Container */}
                    <div className="lg:col-span-2 bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 space-y-6 shadow-xs">
                      <div className="border-b border-slate-100 pb-4 space-y-2">
                        <div className="flex justify-between items-center">
                          <span className="px-3 py-1 bg-teal-50 text-teal-700 text-xs font-extrabold rounded-full border border-teal-200">
                            {currentArticle.category} • {currentArticle.level}
                          </span>
                          <button
                            onClick={() => speakText(currentArticle.paragraphs.join(' '))}
                            className="flex items-center space-x-1.5 text-xs text-teal-600 hover:text-teal-800 font-bold"
                          >
                            <Icon name="volume-2" className="w-4 h-4" />
                            <span>全文語音朗讀</span>
                          </button>
                        </div>
                        <h2 className="text-xl sm:text-2xl font-extrabold text-slate-900 leading-snug">
                          {currentArticle.title}
                        </h2>
                        <div className="flex items-center space-x-4 text-xs text-slate-500">
                          <span>總字數：{currentArticle.wordCount} words</span>
                          <span>💡 點擊內文高亮單字可查字發音</span>
                        </div>
                      </div>

                      {/* Interactive Paragraphs */}
                      <div className="space-y-4 text-slate-700 leading-relaxed text-sm sm:text-base font-normal">
                        {currentArticle.paragraphs.map((p, idx) => (
                          <p key={idx} className="p-3 rounded-xl hover:bg-slate-50/80 transition-colors">
                            {renderInteractiveParagraph(p)}
                          </p>
                        ))}
                      </div>

                      {/* Summary Box */}
                      <div className="p-4 bg-teal-50/70 rounded-xl border border-teal-100 text-xs text-teal-900 space-y-1">
                        <span className="font-extrabold text-teal-700 block">💡 本文中文段落摘要：</span>
                        <p className="leading-relaxed">{currentArticle.summary}</p>
                      </div>
                    </div>

                    {/* Side Sidebar: Keywords & Interactive Popup Card */}
                    <div className="space-y-6">
                      {/* Active Clicked Word Highlight Card */}
                      {activeKeyword && (
                        <div className="bg-gradient-to-br from-teal-500 to-teal-700 text-white p-5 rounded-2xl shadow-md space-y-3 animate-fade-in">
                          <div className="flex justify-between items-center">
                            <span className="text-[10px] font-black uppercase tracking-wider bg-teal-800/60 px-2 py-0.5 rounded">
                              互動點擊卡
                            </span>
                            <button
                              onClick={() => speakText(activeKeyword.word)}
                              className="p-1 hover:bg-teal-600 rounded-full"
                            >
                              <Icon name="volume-2" className="w-4 h-4" />
                            </button>
                          </div>
                          <div>
                            <h4 className="text-2xl font-black">{activeKeyword.word}</h4>
                            <span className="text-xs text-teal-100 font-mono">{activeKeyword.phonetic} • {activeKeyword.pos}</span>
                          </div>
                          <p className="text-sm font-bold bg-white/10 p-2.5 rounded-xl border border-white/20">
                            {activeKeyword.mean}
                          </p>
                        </div>
                      )}

                      <div className="bg-white p-5 rounded-2xl border border-slate-200 space-y-4 shadow-xs">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                          <h3 className="font-extrabold text-slate-900 text-sm flex items-center space-x-1.5">
                            <Icon name="bookmark" className="w-4 h-4 text-teal-600" />
                            <span>核心文章單字 (Keywords)</span>
                          </h3>
                        </div>

                        <div className="space-y-3">
                          {currentArticle.keywords.map((kw, idx) => (
                            <div
                              key={idx}
                              onClick={() => {
                                setActiveKeyword(kw);
                                speakText(kw.word);
                              }}
                              className="p-3 bg-slate-50 hover:bg-teal-50/60 rounded-xl border border-slate-100 text-xs space-y-1 cursor-pointer transition-colors"
                            >
                              <div className="flex justify-between items-center font-bold text-slate-900">
                                <span className="text-teal-800 font-extrabold">{kw.word}</span>
                                <span className="text-slate-400 text-[10px] font-mono">{kw.phonetic} {kw.pos}</span>
                              </div>
                              <p className="text-slate-600">{kw.mean}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'strategies' && (
                <div className="space-y-8 animate-fade-in">
                  <div className="text-center max-w-2xl mx-auto space-y-2">
                    <span className="px-3 py-1 bg-teal-100 text-teal-700 text-xs font-extrabold rounded-full">
                      核心技能指南
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">提升英文閱讀理解的三大策略</h2>
                    <p className="text-slate-600 text-xs sm:text-sm">
                      掌握 Skimming、Scanning 與 Context Clues，擺脫逐字死背翻譯的閱讀瓶頸。
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {READING_STRATEGIES.map((strat, idx) => (
                      <div key={idx} className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4 shadow-xs flex flex-col justify-between">
                        <div className="space-y-3">
                          <h3 className="text-lg font-extrabold text-slate-900">{strat.title}</h3>
                          <span className="inline-block px-2.5 py-1 bg-teal-50 text-teal-700 text-xs font-extrabold rounded-md border border-teal-200">
                            {strat.purpose}
                          </span>
                          <p className="text-xs text-slate-600 leading-relaxed">{strat.description}</p>
                        </div>

                        <div className="space-y-2 pt-4 border-t border-slate-100 text-xs">
                          <span className="font-bold text-slate-800">操作步驟：</span>
                          <ul className="space-y-1.5 text-slate-600">
                            {strat.steps.map((step, sIdx) => (
                              <li key={sIdx} className="flex items-start space-x-1.5">
                                <span className="text-teal-600 font-bold">•</span>
                                <span>{step}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab === 'quiz' && (
                <div className="max-w-2xl mx-auto space-y-6 animate-fade-in">
                  <div className="text-center space-y-2">
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">閱讀理解隨堂互動測驗</h2>
                    <p className="text-slate-600 text-xs sm:text-sm">
                      針對當前文章《{currentArticle.title}》進行即時選擇答題與測驗評估。
                    </p>
                  </div>

                  <div className="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 space-y-6 shadow-xs">
                    {currentArticle.questions.map((q, qIdx) => {
                      const selectedOpt = userQuizAnswers[qIdx];
                      const isAnswered = selectedOpt !== undefined;
                      const isCorrect = selectedOpt === q.answer;

                      return (
                        <div key={qIdx} className="space-y-4 border-b border-slate-100 pb-6 last:border-b-0 last:pb-0">
                          <h3 className="font-bold text-slate-900 text-sm sm:text-base flex items-start space-x-2">
                            <span className="px-2 py-0.5 bg-teal-100 text-teal-800 text-xs font-black rounded shrink-0 mt-0.5">
                              Q{qIdx + 1}
                            </span>
                            <span>{q.question}</span>
                          </h3>

                          <div className="space-y-2">
                            {q.options.map((opt, oIdx) => {
                              let optionClass = "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100";
                              if (isAnswered) {
                                if (oIdx === q.answer) {
                                  optionClass = "bg-emerald-500 text-white border-emerald-600 font-bold";
                                } else if (oIdx === selectedOpt) {
                                  optionClass = "bg-rose-500 text-white border-rose-600 font-bold";
                                }
                              }

                              return (
                                <button
                                  key={oIdx}
                                  onClick={() => handleOptionSelect(qIdx, oIdx)}
                                  className={`w-full text-left p-3.5 rounded-xl border text-xs font-medium transition-all ${optionClass}`}
                                >
                                  {opt}
                                </button>
                              );
                            })}
                          </div>

                          {isAnswered && (
                            <div className={`p-3.5 rounded-xl border text-xs space-y-1 ${
                              isCorrect ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-amber-50 border-amber-200 text-amber-900'
                            }`}>
                              <span className="font-bold block">
                                {isCorrect ? '✅ 回答正確！' : '❌ 答錯囉！請參考以下解析：'}
                              </span>
                              <p>{q.explanation}</p>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </main>

            {/* Footer */}
            <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
              <p>ReadingMaster 英文閱讀理解大師 • 高效速度訓練與情境閱讀平台</p>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
